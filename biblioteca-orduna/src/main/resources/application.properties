# =====================================================================
#  Sistema de Biblioteca - Configuración
# =====================================================================
spring.application.name=biblioteca
server.port=8080

# ---------- Base de datos (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_orduna?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=denis123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: crea/actualiza las tablas a partir de las entidades sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Script inicial (data.sql) ----------
# Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas.
# Usa INSERT IGNORE, así que se puede reiniciar la app sin duplicar datos.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

# ---------- JSON ----------
spring.jackson.time-zone=America/Lima
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- JWT ----------
# Clave secreta para firmar los tokens (mínimo 32 caracteres). Cambiarla en producción.
jwt.secret=BibliotecaOrduna-ClaveSecreta-JWT-2026-CambiarEnProduccion!
# Duración del token: 8 horas (en milisegundos)
jwt.expiration-ms=28800000

# ---------- CORS ----------
# Orígenes del frontend permitidos, separados por coma (Angular, Vite/React, CRA, Live Server)
cors.allowed-origins=http://localhost:4200,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
